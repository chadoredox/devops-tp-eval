services:
  redis:
    image: redis:7.2-alpine
    container_name: phrase-parser-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phrase-parser-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_VERSION=1.0.0
      - COMMIT_SHA=local-compose
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: phrase-parser-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./alerts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts/prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
